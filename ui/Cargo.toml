[package]
name = "ui"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
shared = { path = "../shared" }
leptos = { version = "0.7", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Navigator", "HtmlVideoElement", "HtmlMediaElement", "Storage", "Element", "Document", "Window", "MediaQueryList", "console", "HtmlImageElement", "DomRect", "CssStyleDeclaration", "HtmlElement", "NodeList", "HtmlMediaElement", "DomRectReadOnly", "ScrollIntoViewOptions", "ScrollLogicalPosition", "ResizeObserver", "ResizeObserverEntry"] }
console_error_panic_hook = "0.1"

id: brightline-basics
title: Getting started with Brightline Notes
short: Brightline basics
order: 1
gated: false
summary: Learn to write, organise, find and share notes in Brightline Notes, a fictional note-taking web app.
thread: A small team planning a community garden day runs through the course as the example.
sessions:
  - id: s1
    phase: Basics
    title: Your first notes
    outcome: Find your way around the workspace, write and format a note, and file it with notebooks and tags.
    lessons: [1-1-welcome-to-brightline, 1-2-writing-and-formatting, 1-3-notebooks-and-tags]
    check: s1-check
    exercise: s1-set-up-your-workspace
  - id: s2
    phase: Basics
    title: Find, share and keep
    outcome: Find any note with search, share it with the right access, and recover or export your work.
    lessons: [2-1-searching-your-notes, 2-2-sharing-and-comments, 2-3-history-trash-and-export]
    check: s2-check
    exercise: s2-share-a-plan
assessment: final

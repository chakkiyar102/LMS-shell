# Button labels that mean an action your app treats as one-way (add your own).
irreversible_label: []

# What confirmation dialogs say when an action can't be taken back.
irreversible_text:
  - "cannot be undone"
  - "cant be undone"
  - "can not be undone"
  - "cannot be deleted"
  - "cant be deleted"
  - "can not be deleted"
  - "cannot be reversed"
  - "cant be reversed"
  - "cannot be recovered"
  - "cant be recovered"
  - "irreversible"
  - "permanently"
  - "this action is final"
  - "no way to undo"
  - "will be lost forever"


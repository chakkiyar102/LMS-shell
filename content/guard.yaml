  - "ignore previous"
  - "ignore all previous"
  - "ignore the previous"
  - "ignore the above"
  - "ignore your instructions"
  - "ignore all instructions"
  - "ignore any instructions"
  - "disregard previous"
  - "disregard all"
  - "disregard the above"
  - "disregard your"
  - "forget your instructions"
  - "forget previous instructions"
  - "forget all previous"
  - "new instructions"
  - "system prompt"
  - "you are now"
  - "developer mode"
  - "jailbreak"
  - "do not tell the learner"

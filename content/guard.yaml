# The screen helper's action guard: which words in a control's label, its dialog or the page URL make
# an action Blocked (never done), need the learner's Allow (Confirm), or are plain Allow. Compiled into
# the app (src-tauri/src/guard.rs reads it at first use). Whole words or phrases, lowercase; write
# "don't" as "dont". Add your app's own words: a destructive button label to `delete`, an admin URL
# segment to `admin_path`, a one-way action to `irreversible_label`. See SECURITY.md.

# Labels that only close or back out of something: always fine, even in a delete confirmation.
dismiss:
  - "cancel"
  - "close"
  - "no"
  - "back"
  - "go back"
  - "keep"
  - "keep editing"
  - "not now"
  - "dismiss"
  - "x"
  - "no thanks"
  - "stay"
  - "dont"
  - "dont delete"
  - "dont save"
  - "keep it"
  - "never mind"
  - "nevermind"

